{% extends 'base.html' %}
{% block content %}
<div class="container my-5" style="max-width: 500px;">
    <div class="card p-4 shadow-sm border-0">
        <h2 class="fw-bold mb-3 text-center">Create Account 📝</h2>
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <div class="form-text small text-muted">{{ field.help_text }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-success w-100 fw-bold py-2">Register</button>
        </form>
    </div>
</div>
{% endblock %}
